version: "3.8"

services:
  trace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trace-app
    image: trace:latest
    restart: unless-stopped
    ports:
      - "${PORT:-5174}:5174"
    environment:
      - PORT=5174
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5174/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
