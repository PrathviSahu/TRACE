<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D9C5" />
      <stop offset="100%" stop-color="#FF9F43" />
    </linearGradient>
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <linearGradient id="tr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D9C5" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#21262D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tr-bg)" stroke="url(#tr-border)" stroke-width="1.4" />

  <!-- Code Bracket Left -->
  <path d="M 7.5 11 L 4 16 L 7.5 21" fill="none" stroke="#38D9C5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Code Bracket Right -->
  <path d="M 24.5 11 L 28 16 L 24.5 21" fill="none" stroke="#FF9F43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- T-Trace Bar -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="url(#tr-grad)" stroke-width="2.4" stroke-linecap="round" />

  <!-- T-Trace Stem -->
  <line x1="16" y1="10" x2="16" y2="22" stroke="url(#tr-grad)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Graph Nodes on Crossbar -->
  <circle cx="10" cy="10" r="1.8" fill="#38D9C5" />
  <circle cx="22" cy="10" r="1.8" fill="#FF9F43" />

  <!-- Decision Pulse & Target Node -->
  <circle cx="16" cy="16" r="1.3" fill="#38D9C5" />
  <circle cx="16" cy="22" r="2.3" fill="#FF9F43" />
  <circle cx="16" cy="22" r="1" fill="#FFFFFF" />
</svg>